<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Demo B — Chrome DevTools Breakpoints &amp; BOM Storage</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family:
                    system-ui,
                    -apple-system,
                    sans-serif;
                background-color: #0f172a;
                color: #f8fafc;
                padding: 2rem;
                line-height: 1.5;
            }
            .panel {
                max-width: 640px;
                margin: 0 auto;
                background-color: #1e293b;
                padding: 1.5rem;
                border-radius: 10px;
                border: 1px solid #334155;
            }
            h2 {
                color: #38bdf8;
                margin-bottom: 0.5rem;
                font-size: 1.35rem;
            }
            p {
                color: #cbd5e1;
                font-size: 0.95rem;
            }
            button {
                background-color: #38bdf8;
                color: #0f172a;
                border: none;
                padding: 0.6rem 1.1rem;
                border-radius: 6px;
                font-weight: 700;
                cursor: pointer;
                margin-top: 1rem;
            }
            button:hover {
                background-color: #7dd3fc;
            }
            ul {
                margin-top: 1.25rem;
                padding-left: 1.25rem;
                color: #e2e8f0;
            }
            li {
                margin-bottom: 0.4rem;
            }
        </style>
    </head>
    <body>
        <div class="panel">
            <h2>FCAI Portal — Saved Bookmarks (BOM + DevTools Demo)</h2>
            <p>
                Open
                <strong
                    >Chrome DevTools (F12) &rarr; Sources &rarr;
                    devtools-bom-demo.js</strong
                >
            </p>
            <button id="add-bookmark-btn" type="button">
                + Bookmark "Git Workshop"
            </button>
            <ul id="bookmark-list"></ul>
        </div>

        <script src="./devtools-bom-demo.js"></script>
    </body>
</html>
